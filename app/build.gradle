plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ── Version ─────────────────────────────────────────────────────────────────
// Single source of truth: the root VERSION file (MAJOR.MINOR.BUILD).
// Bump it with ./scripts/bump-version.sh. versionCode = the BUILD component,
// which always increments on a bump, so it stays monotonic across releases.
def versionFile = rootProject.file('VERSION')
def evtrackVersionName = versionFile.exists() ? versionFile.text.trim() : '1.0.0'
def evtrackVersionCode = evtrackVersionName.tokenize('.').last().toInteger()

// ── ARCS credential ─────────────────────────────────────────────────────────
// The fleet licence authenticates the Manager to the ARCS downloads endpoint. Put it in
// local.properties as  arcs.licenseJwt=eyJ...  (that file is gitignored), or export
// ARCS_LICENSE_JWT. The licence contains a private key: never commit it.
def arcsLicenseJwt = ""
def localProps = rootProject.file('local.properties')
if (localProps.exists()) {
    def props = new Properties()
    localProps.withInputStream { props.load(it) }
    arcsLicenseJwt = props.getProperty('arcs.licenseJwt', '')
}
if (!arcsLicenseJwt) {
    arcsLicenseJwt = System.getenv('ARCS_LICENSE_JWT') ?: ''
}
if (!arcsLicenseJwt) {
    logger.warn('ARCS licence not configured: set arcs.licenseJwt in local.properties. ' +
            'Update checks will report the app as unconfigured.')
}

android {
    namespace 'com.evtrack.kioskmanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.evtrack.kioskmanager"
        minSdk 26
        targetSdk 34
        versionCode evtrackVersionCode
        versionName evtrackVersionName

        // ARCS fleet licence, read from local.properties (gitignored) or the environment.
        // It carries a private key in its spr claim, so it is deliberately NOT held in source.
        // Absent, the app builds and runs but every update check reports that it is unconfigured.
        buildConfigField "String", "ARCS_LICENSE_JWT", "\"${arcsLicenseJwt}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Release signing via environment variables (see build.sh / release/keys.sh).
    // Uses the SHARED EvTrack keystore (alias evtrack-release) — same key as the
    // main app (com.evtrack.frontdesk), so the two share a signature identity.
    // Nothing secret is stored in-tree; the four vars are exported by keys.sh.
    signingConfigs {
        release {
            def keystorePath = System.getenv('EVTRACK_KEYSTORE_FILE')
            if (keystorePath) {
                storeFile file(keystorePath)
            }
            storePassword System.getenv('EVTRACK_KEYSTORE_PASSWORD')
            keyAlias System.getenv('EVTRACK_KEY_ALIAS')
            keyPassword System.getenv('EVTRACK_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
